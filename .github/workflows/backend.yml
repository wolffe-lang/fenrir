name: backend
on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fenrir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-${{ matrix.os }}-${{ hashFiles('wolf-toolchain.toml') }}
      - run: tools/fetch-toolchain
      - run: bash ci/backend-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-core-${{ matrix.os }}
          path: target/backend-core
  # The Linux gate runs as parallel jobs, each `tests/backend/run-linux PART`
  # (the shared fetch and builds, then that part's steps); `backend-parts` in
  # ci/check fails when a step runs in no job or in two. Each cap is at least
  # twice the part's time on a fast runner; slow runners have taken up to 1.7
  # times as long. Measured on 2026-11-21: the proof 39 to 66 minutes, the
  # lowering rows 18 to 36. The corpus differential, one job until then, took 57
  # to 71 minutes and passed 80 on two slow runners, so it runs as three shards
  # of the core rows (each about a third of its 56-minute differential step)
  # beside one job for the tranche steps (about 14 minutes of steps). The proof,
  # one job until 2026-11-23, took 51 and 76 minutes at 8cb589c (3,009 and 4,519
  # seconds of steps), so it runs as two halves of about 25 minutes each on a
  # fast runner and 38 on a slow one: `linux-proof` runs proof-1 (the
  # linked-program proof, the backend rows and scaling) and `linux-proof-2` runs
  # proof-2 (the generated mode and string case tables).
  linux-proof:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: Capped scaling, backend rows and the linked-program proof
        # The existing 6 GiB soft / 10 GiB hard envelope covers the whole job.
        # Each link independently lowers both limits to 2 GiB; link-budget
        # records the linker's own peak, not the test runner's memory.
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux proof-1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-proof
          path: |
            target/backend-record
            target/backend-link-budget
            target/interpreter-bounded
            target/interpreter-scaling
            target/backend-scaling/scaling.json
            target/backend-forms-after/results.json
            target/backend-linux/**/results.json
            target/backend-linux/**/*.json
            target/backend-linux/**/*.stdout
            target/backend-linux/**/*.stderr
            target/backend-linux/**/*.outcome
            target/backend-linux/**/*.s
            target/backend-linux/**/*.fir
            target/backend-linux/**/*.lu
            target/backend-linux/gnu-as-version.txt
            target/lower-scaling/scaling.json
  linux-proof-2:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The generated mode and string case tables, native
        # The same 6 GiB soft / 10 GiB hard envelope as proof-1 covers the whole
        # job; each link independently lowers both limits to 2 GiB.
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux proof-2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-proof-2
          path: |
            target/backend-record
            target/backend-linux/**/results.json
            target/backend-linux/**/*.json
            target/backend-linux/**/*.stdout
            target/backend-linux/**/*.stderr
            target/backend-linux/**/*.outcome
            target/backend-linux/**/*.s
            target/backend-linux/**/*.fir
            target/backend-linux/**/*.lu
  lower-linux:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The lowering rows, linked and run beside the pinned wolf
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux lower
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lower-linux
          path: |
            target/backend-record
            target/lower-linux/**/*.lu
            target/lower-linux/**/*.stdout
            target/lower-linux/**/*.stderr
  corpus-core-1:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The census-driven corpus differential, shard 1 of 3
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux corpus-1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-corpus-core-1
          path: |
            target/backend-record
            target/lower-corpus/shard-1/selection.json
            target/lower-corpus/shard-1/verdicts.json
            target/lower-corpus/shard-1/comparison.json
            target/lower-corpus/shard-1/compare.stdout
  corpus-core-2:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The census-driven corpus differential, shard 2 of 3
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux corpus-2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-corpus-core-2
          path: |
            target/backend-record
            target/lower-corpus/shard-2/selection.json
            target/lower-corpus/shard-2/verdicts.json
            target/lower-corpus/shard-2/comparison.json
            target/lower-corpus/shard-2/compare.stdout
  corpus-core-3:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The census-driven corpus differential, shard 3 of 3
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux corpus-3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-corpus-core-3
          path: |
            target/backend-record
            target/lower-corpus/shard-3/selection.json
            target/lower-corpus/shard-3/verdicts.json
            target/lower-corpus/shard-3/comparison.json
            target/lower-corpus/shard-3/compare.stdout
  corpus-tranches:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The string predictions, the frozen tranches and the interpreter's core table
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux tranches
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-corpus-tranches
          path: |
            target/backend-record
            target/lower-corpus/string-prediction-native
            target/interpreter-core
            target/tranche/**/results.json
            target/tranche/**/verdicts.json
