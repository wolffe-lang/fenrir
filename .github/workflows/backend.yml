name: backend
on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fenrir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-${{ matrix.os }}-${{ hashFiles('wolf-toolchain.toml') }}
      - run: tools/fetch-toolchain
      - run: bash ci/backend-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-core-${{ matrix.os }}
          path: target/backend-core
  # The Linux gate runs as three parallel jobs, each `tests/backend/run-linux PART`
  # (the shared fetch and builds, then that part's steps). Each cap is at least
  # twice the part's measured time on this runner: the proof about 57 minutes,
  # the lowering rows about 54, the corpus differential about 32.
  linux-proof:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: Capped scaling and native toolchain proof
        # The existing 6 GiB soft / 10 GiB hard envelope covers the whole job.
        # Each link independently lowers both limits to 2 GiB; link-budget
        # records the linker's own peak, not the test runner's memory.
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux proof
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-proof
          path: |
            target/backend-record
            target/backend-link-budget
            target/interpreter-bounded
            target/interpreter-scaling
            target/backend-scaling/scaling.json
            target/backend-forms-after/results.json
            target/backend-linux/**/results.json
            target/backend-linux/**/*.json
            target/backend-linux/**/*.stdout
            target/backend-linux/**/*.stderr
            target/backend-linux/**/*.outcome
            target/backend-linux/**/*.s
            target/backend-linux/**/*.fir
            target/backend-linux/**/*.lu
            target/backend-linux/gnu-as-version.txt
            target/lower-scaling/scaling.json
  lower-linux:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The lowering rows, linked and run beside the pinned wolf
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux lower
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lower-linux
          path: |
            target/backend-record
            target/lower-linux/**/*.lu
            target/lower-linux/**/*.stdout
            target/lower-linux/**/*.stderr
  corpus-core:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: The census-driven corpus differential
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux corpus
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-corpus-core
          path: |
            target/backend-record
            target/lower-corpus/verdicts.json
            target/lower-corpus/comparison.json
            target/lower-corpus/compare.stdout
            target/lower-corpus/string-prediction-native
            target/interpreter-core
