name: backend
on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fenrir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-${{ matrix.os }}-${{ hashFiles('wolf-toolchain.toml') }}
      - run: tools/fetch-toolchain
      - run: bash ci/backend-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-core-${{ matrix.os }}
          path: target/backend-core
  linux-proof:
    if: ${{ !contains(github.head_ref, '-plant-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .wolf-bin/downloads
          key: fenrir-backend-proof-${{ hashFiles('wolf-toolchain.toml') }}
      - name: Capped scaling and native toolchain proof
        # Every process keeps a 6 GiB address-space soft limit. Only each link, which
        # needs 7.4 GiB, raises its own soft limit to the 10 GiB hard limit
        # (tests/backend/linux.py, LINK_ADDRESS_SPACE).
        run: prlimit --as=6442450944:10737418240 bash tests/backend/run-linux
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-proof
          path: |
            target/backend-record
            target/backend-scaling/scaling.json
            target/backend-forms-after/results.json
            target/backend-linux/**/results.json
            target/backend-linux/**/*.json
            target/backend-linux/**/*.stdout
            target/backend-linux/**/*.stderr
            target/backend-linux/**/*.s
            target/backend-linux/**/*.fir
            target/backend-linux/**/*.lu
            target/backend-linux/gnu-as-version.txt
